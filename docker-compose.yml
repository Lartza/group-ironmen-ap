version: "3.8"
services:
  group-ironmen-tracker-frontend:
    build:
      context: ./site
      dockerfile: Dockerfile
    # image: chrisleeeee/group-ironmen-tracker-frontend
    environment:
      - HOST_URL=${HOST_URL}
    restart: always
    container_name: group-ironmen-tracker-frontend
    ports:
      - 4040:4000 # replace this if using a docker-compatible reverse proxy like traefik
  group-ironmen-tracker-backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    # image: chrisleeeee/group-ironmen-tracker-backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PG_USER=${PG_USER}
      - PG_PASSWORD=${PG_PASSWORD}
      - PG_HOST=${PG_HOST}
      - PG_PORT=${PG_PORT}
      - PG_DB=${PG_DB}
      - BACKEND_SECRET=${BACKEND_SECRET}
    restart: always
    container_name: group-ironmen-tracker-backend
    ports:
      - 5050:8080  # replace this if using a docker-compatible reverse proxy like traefik
